<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Área restrita | Grupo Teatral Cerne</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="login-page">

<main class="login-shell">

    <div class="login-stars" aria-hidden="true"></div>

    <a
            class="login-brand"
            th:href="@{/}"
            aria-label="Voltar para o início"
    >
        <img
                th:src="@{/css/img/logoCerne.png}"
                alt="Grupo Teatral Cerne"
        >
    </a>

    <section class="login-card">

        <span class="eyebrow">
            Área restrita
        </span>

        <h1>
            Bem-vindo.
        </h1>

        <p class="login-subtitle">
            Entre para acessar o painel administrativo
            e gerenciar as notícias.
        </p>

        <p
                th:if="${param.error}"
                class="login-error"
        >
            Email ou senha inválidos.
        </p>

        <form
                class="login-form"
                th:action="@{/login}"
                method="post"
        >

            <div class="form-group">

                <label for="username">
                    Email
                </label>

                <input
                        id="username"
                        type="email"
                        name="username"
                        placeholder="seu@email.com"
                        autocomplete="username"
                        required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Senha
                </label>

                <input
                        id="password"
                        type="password"
                        name="password"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                >

            </div>

            <button
                    class="login-button"
                    type="submit"
            >
                Entrar
            </button>

        </form>

        <a
                class="back-home"
                th:href="@{/}"
        >
            ← Voltar para as notícias
        </a>

    </section>

</main>


<script>

    const starsContainer = document.querySelector('.login-stars');


    function createStar() {

        const star = document.createElement('span');

        star.classList.add('login-star');


        // Posição aleatória pela tela inteira
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';


        // Tamanho aleatório
        const size = 2 + Math.random() * 3;

        star.style.width = size + 'px';
        star.style.height = size + 'px';


        // Pequena variação na duração
        const duration = 600 + Math.random() * 500;

        star.style.animationDuration = duration + 'ms';


        starsContainer.appendChild(star);


        setTimeout(() => {
            star.remove();
        }, duration + 100);
    }


    document.addEventListener('input', function () {

        const amount = 1 + Math.floor(Math.random() * 3);

        for (let i = 0; i < amount; i++) {

            setTimeout(() => {
                createStar();
            }, Math.random() * 200);

        }

    });

</script>

</body>
</html>
